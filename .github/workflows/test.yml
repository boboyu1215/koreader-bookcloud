name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
      - run: docker compose config --quiet
      - run: BOOKCLOUD_HOST=books.example.com docker compose -f compose.yaml -f compose.https.yaml config --quiet
      - run: docker compose build
      - name: Verify fresh deployment and non-root data volume
        run: |
          docker compose up -d --wait --wait-timeout 60
          curl --fail http://127.0.0.1:18083/bookcloud/health
          docker compose exec -T bookcloud python -c "import os; from pathlib import Path; assert os.getuid() == 10001; assert all(len((Path('/data') / n).read_text().strip()) >= 32 for n in ('admin-token', 'device-token', 'signing-key'))"
      - name: Clean up test deployment
        if: always()
        run: docker compose down -v
