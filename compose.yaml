services:
  bookcloud:
    build: ./server
    restart: unless-stopped
    ports:
      - "127.0.0.1:18083:8080"
    volumes:
      - bookcloud-data:/data
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/bookcloud/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  bookcloud-data:
